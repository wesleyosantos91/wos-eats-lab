server:
  port: 8090

spring:
  application:
    name: catalog-service
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    url: jdbc:postgresql://localhost:5432/catalog?currentSchema=catalog_schema
    username: postgres
    password: postgres
    hikari:
      maximum-pool-size: 20        # Aumentado de 10 para melhor concorrência
      minimum-idle: 5              # Aumentado de 2 para manter conexões prontas
      connection-timeout: 20000    # Aumentado para 20s
      idle-timeout: 300000         # 5min idle timeout
      max-lifetime: 1200000        # 20min max lifetime
      leak-detection-threshold: 60000  # Detectar vazamentos de conexão
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
          batch_size: 25           # Otimização para batch processing
          fetch_size: 25           # Otimização de fetch
        default_schema: public
        query:
          plan_cache_max_size: 2048  # Cache de query plans
        cache:
          use_second_level_cache: false  # Desabilitado por enquanto
  flyway:
    enabled: true
    locations: classpath:db/migration
    url: ${spring.datasource.url}
    user: ${spring.datasource.username}
    password: ${spring.datasource.password}
    schemas: catalog_schema
  cloud:
    aws:
      s3:
        bucket: wos-eats-lab-catalog-bucket
        region: us-east-1
        path-style-access-enabled: true
        endpoint: http://localhost:4566
      credentials:
        access-key: test
        secret-key: test
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 10
          max-idle: 10
          min-idle: 1
          max-wait: -1ms
  cache:
    type: redis
    redis:
      cache-null-values: false
      time-to-live: 600000  # 10 minutos
management:
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
    enable:
      jvm: true
      process: true
      system: true
      logback: true
      logstash: true
  endpoints:
    web:
      exposure:
        include: metrics,info,health
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
    baggage:
      correlation:
        enabled: true
        fields: [x-correlationID]
      remote-fields: [x-correlationID]
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces
    metrics:
      export:
        enabled: true
        url: http://localhost:4318/v1/metrics
  observations:
    key-values:
      my_custom_tag: ${spring.application.name}

