server:
  port: 8090

spring:
  application:
    name: catalog-service
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    url: jdbc:postgresql://localhost:5432/catalog?currentSchema=catalog_schema
    username: postgres
    password: postgres
    hikari:
      maximum-pool-size: 8         # ⭐ Reduzido: cache reduz hits ao DB
      minimum-idle: 3              # ⭐ Reduzido: menos conexões idle
      connection-timeout: 15000    # ⭐ Mais agressivo
      idle-timeout: 240000         # ⭐ 4min (reduzido)
      max-lifetime: 900000         # ⭐ 15min (reduzido)
      leak-detection-threshold: 30000  # ⭐ Mais agressivo (30s)
      keepalive-time: 120000       # ⭐ 2min keep-alive
      validation-timeout: 3000     # ⭐ Validação rápida
      initialization-fail-timeout: 5000  # ⭐ Falha rápida na init
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
          batch_size: 25           # Otimização para batch processing
          fetch_size: 25           # Otimização de fetch
        default_schema: public
        query:
          plan_cache_max_size: 2048  # Cache de query plans
        cache:
          use_second_level_cache: false  # Desabilitado por enquanto
  flyway:
    enabled: true
    locations: classpath:db/migration
    url: ${spring.datasource.url}
    user: ${spring.datasource.username}
    password: ${spring.datasource.password}
    schemas: catalog_schema
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 10
          max-idle: 10
          min-idle: 1
          max-wait: -1ms
  cache:
    type: redis
    redis:
      cache-null-values: false
      time-to-live: 600000  # 10 minutos
  cloud:
    aws:
      s3:
        endpoint: http://localhost:4566
        region: us-east-1
        path-style-access-enabled: true
management:
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
    enable:
      jvm: true
      process: true
      system: true
      logback: true
      logstash: true
  endpoints:
    web:
      exposure:
        include: metrics,info,health
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
    baggage:
      correlation:
        enabled: true
        fields: [x-correlationID]
      remote-fields: [x-correlationID]
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces
    metrics:
      export:
        enabled: true
        url: http://localhost:4318/v1/metrics
  observations:
    key-values:
      my_custom_tag: ${spring.application.name}

resilience4j:
  retry:
    instances:
      s3Storage:
        max-attempts: 3
        wait-duration: 200ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2.0
        enable-randomized-wait: true
        randomized-wait-factor: 0.5
        retry-exceptions:
          - java.io.IOException
          - io.github.wesleyosantos91.catalog.domain.exception.InfrastructureException
          - software.amazon.awssdk.core.exception.SdkException
        ignore-exceptions:
          - java.lang.IllegalArgumentException
      productService:
        max-attempts: 2
        wait-duration: 150ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 1.5
        enable-randomized-wait: true
        randomized-wait-factor: 0.4
        retry-exceptions:
          - org.springframework.dao.DataAccessException
          - io.github.wesleyosantos91.catalog.domain.exception.BusinessException
        ignore-exceptions:
          - io.github.wesleyosantos91.catalog.domain.exception.ResourceNotFoundException
      restaurantService:
        max-attempts: 2
        wait-duration: 150ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 1.5
        enable-randomized-wait: true
        randomized-wait-factor: 0.4
        retry-exceptions:
          - org.springframework.dao.DataAccessException
          - io.github.wesleyosantos91.catalog.domain.exception.BusinessException
        ignore-exceptions:
          - io.github.wesleyosantos91.catalog.domain.exception.ResourceNotFoundException
      kitchenService:
        max-attempts: 2
        wait-duration: 150ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 1.5
        enable-randomized-wait: true
        randomized-wait-factor: 0.4
        retry-exceptions:
          - org.springframework.dao.DataAccessException
          - io.github.wesleyosantos91.catalog.domain.exception.BusinessException
        ignore-exceptions:
          - io.github.wesleyosantos91.catalog.domain.exception.ResourceNotFoundException
  circuitbreaker:
    instances:
      s3Storage:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        ignore-exceptions:
          - java.lang.IllegalArgumentException
      productService:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 20s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        ignore-exceptions:
          - io.github.wesleyosantos91.catalog.domain.exception.ResourceNotFoundException
      restaurantService:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 20s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        ignore-exceptions:
          - io.github.wesleyosantos91.catalog.domain.exception.ResourceNotFoundException
      kitchenService:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 20s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        ignore-exceptions:
          - io.github.wesleyosantos91.catalog.domain.exception.ResourceNotFoundException
  bulkhead:
    instances:
      s3StorageBulkhead:
        max-concurrent-calls: 10
        max-wait-duration: 2s
      productServiceBulkhead:
        max-concurrent-calls: 30
        max-wait-duration: 1s
      restaurantServiceBulkhead:
        max-concurrent-calls: 30
        max-wait-duration: 1s
      kitchenServiceBulkhead:
        max-concurrent-calls: 30
        max-wait-duration: 1s

app:
  s3-bucket-name: wos-eats-catalog
  max-size-bytes: 5242880 # 5MB
  allowed-content-types:
    - image/jpeg
    - image/png
    - image/jpg
