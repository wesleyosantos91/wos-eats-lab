spring:
  application:
    name: catalog-service-integration-tests

  datasource:
    url: jdbc:tc:postgresql:16-alpine:///testdb
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true

logging:
  level:
    io.github.wesleyosantos91: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG

