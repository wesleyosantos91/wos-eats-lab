global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Disponibilidade end-to-end do /hello via Kong (sonda sintética)
  - job_name: blackbox
    metrics_path: /probe
    params: { module: [http_2xx] }
    static_configs:
      - targets: ["http://kong:8000/hello"]
    relabel_configs:
      - { source_labels: [__address__], target_label: __param_target }
      - { source_labels: [__param_target], target_label: instance }
      - { target_label: __address__, replacement: blackbox:9115 }

  # Métricas expostas pelo OTel Collector (Prometheus exporter interno)
  - job_name: otel-collector
    scrape_interval: 10s
    static_configs:
      - targets: ["otel-collector:8889"]

  # (Opcional) Auto-scrape do Prometheus p/ health do próprio Prometheus
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]
