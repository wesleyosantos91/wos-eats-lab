receivers:
  otlp:
    protocols:
      http:
        endpoint: otel-collector:4318
      grpc:
        endpoint: otel-collector:4317
  otlp/2:
    protocols:
      grpc:
        endpoint: otel-collector:55679

processors:
  batch: {}

extensions:
  health_check:
    endpoint: otel-collector:13133
  pprof:
    endpoint: otel-collector:1888
  zpages:
    endpoint: otel-collector:55679

exporters:
  debug:
    verbosity: detailed

  prometheus:
    endpoint: "0.0.0.0:8889"
    namespace: otel
    resource_to_telemetry_conversion:
      enabled: true

  otlp/jaeger:
    endpoint:  http://jaeger:4317
    tls: { insecure: true }

  otlp/tempo:
    endpoint: tempo:4317
    tls: { insecure: true }

  otlphttp/loki:
    endpoint: http://loki:3100/loki/api/v1/push
    tls: { insecure: true }

service:
  extensions: [health_check]
  pipelines:
    metrics: { receivers: [otlp, otlp/2], processors: [batch], exporters: [prometheus] }
    traces:  { receivers: [otlp, otlp/2], processors: [batch], exporters: [otlp/tempo, otlp/jaeger] }
    logs:    { receivers: [otlp, otlp/2], processors: [batch], exporters: [otlphttp/loki] }
