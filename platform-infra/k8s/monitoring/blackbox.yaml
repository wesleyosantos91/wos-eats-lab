apiVersion: v1
kind: ConfigMap
metadata:
  name: blackbox-config
  namespace: monitoring
data:
  blackbox.yaml: |
    modules:
      http_2xx:
        prober: http
        timeout: 5s
        http:
          method: GET
          valid_status_codes: [200,204,301,302]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blackbox-exporter
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels: { app: blackbox-exporter }
  template:
    metadata:
      labels: { app: blackbox-exporter }
    spec:
      containers:
        - name: blackbox
          image: prom/blackbox-exporter:v0.25.0
          args: ["--config.file=/etc/blackbox/blackbox.yaml"]
          ports: [{ containerPort: 9115 }]
          readinessProbe: { httpGet: { path: /, port: 9115 }, initialDelaySeconds: 5, periodSeconds: 10 }
          livenessProbe:  { httpGet: { path: /, port: 9115 }, initialDelaySeconds: 10, periodSeconds: 20 }
          volumeMounts: [ { name: cfg, mountPath: /etc/blackbox } ]
      volumes:
        - name: cfg
          configMap: { name: blackbox-config }
---
apiVersion: v1
kind: Service
metadata:
  name: blackbox-exporter
  namespace: monitoring
  labels: { app: blackbox-exporter }
spec:
  selector: { app: blackbox-exporter }
  ports:
    - name: http
      port: 9115
      targetPort: 9115
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: blackbox-kong-health
  namespace: monitoring
spec:
  endpoints:
    - port: http
      interval: 30s
      path: /probe
      params:
        module: [http_2xx]
        target: ["http://api.local/healthz"]
  selector:
    matchLabels: { app: blackbox-exporter }
  namespaceSelector:
    matchNames: ["monitoring"]
