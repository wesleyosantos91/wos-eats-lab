apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: wos-eats-bootstrap
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/wesleyosantos91/platform-infra.git
    targetRevision: main
    path: k8s/argocd/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated: { prune: true, selfHeal: true }
