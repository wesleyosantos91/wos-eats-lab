grafana:
  adminUser: admin
  adminPassword: admin
  service:
    type: NodePort
    nodePort: 32000
  defaultDashboardsEnabled: true
  grafana.ini:
    server:
      root_url: "%(protocol)s://%(domain)s:%(http_port)s/"
    date_formats:
      default_timezone: browser
  sidecar:
    dashboards: { enabled: true }
    datasources: { enabled: true }

prometheus:
  service:
    type: ClusterIP
  prometheusSpec:
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    retention: 15d
    scrapeInterval: 30s
    evaluationInterval: 30s
    walCompression: true
    enableAdminAPI: true
    storageSpec: {}
    externalLabels:
      cluster: wos-eats-local

alertmanager:
  enabled: true
  alertmanagerSpec:
    retention: 120h
    storage: {}
